services:
  grok-register:
    environment:
      GROK_MONITOR_WEBHOOK_ENABLED: ${GROK_MONITOR_WEBHOOK_ENABLED:-true}
      GROK_MONITOR_WEBHOOK_URL: ${GROK_MONITOR_WEBHOOK_URL:-http://monitor-backend:8090/api/integrations/grok-register/account-imported}
      GROK_MONITOR_WEBHOOK_TOKEN: ${MONITOR_WEBHOOK_TOKEN:-}
      GROK_MONITOR_WEBHOOK_TIMEOUT_SECONDS: ${GROK_MONITOR_WEBHOOK_TIMEOUT_SECONDS:-10}

  monitor-backend:
    image: ${MONITOR_BACKEND_IMAGE:-ghcr.io/kaibush/grok-account-monitor-backend:latest}
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GAM_HOST: 0.0.0.0
      GAM_PORT: 8090
      GAM_DATABASE_PATH: /app/data/monitor.db
      GAM_RUNTIME_SECRET_KEY: ${MONITOR_RUNTIME_SECRET_KEY:-}
      GAM_JWT_SECRET_KEY: ${MONITOR_JWT_SECRET_KEY:-}
      GAM_JWT_TTL_SECONDS: ${MONITOR_JWT_TTL_SECONDS:-604800}
      GAM_GROK2API_BASE_URL: ${MONITOR_GROK2API_BASE_URL:-http://host.docker.internal:8000}
      GAM_GROK2API_ADMIN_USERNAME: ${MONITOR_GROK2API_ADMIN_USERNAME:-}
      GAM_GROK2API_ADMIN_PASSWORD: ${MONITOR_GROK2API_ADMIN_PASSWORD:-}
      GAM_GROK_REGISTER_WEBHOOK_TOKEN: ${MONITOR_WEBHOOK_TOKEN:-}
      GAM_INITIAL_PROBE_ON_REGISTER: ${MONITOR_INITIAL_PROBE_ON_REGISTER:-true}
      GAM_REGISTER_PROBE_PROFILE_IDS: '${MONITOR_REGISTER_PROBE_PROFILE_IDS:-["quality-marker"]}'
      GAM_REGISTER_PROBE_EXECUTION_MODE: ${MONITOR_REGISTER_PROBE_EXECUTION_MODE:-chat}
      GAM_REGISTER_PROBE_ROUNDS: ${MONITOR_REGISTER_PROBE_ROUNDS:-3}
      GAM_REGISTER_PROBE_PROXY_TARGETS: '${MONITOR_REGISTER_PROBE_PROXY_TARGETS:-[{"kind":"direct","id":null}]}'
      GAM_CORS_ORIGINS: ${MONITOR_CORS_ORIGINS:-https://monitor.lvyrix.com,http://localhost:8091,http://127.0.0.1:8091}
    expose:
      - "8090"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        aliases:
          - backend
          - monitor-backend
    volumes:
      - monitor-data:/app/data

  monitor-frontend:
    image: ${MONITOR_FRONTEND_IMAGE:-ghcr.io/kaibush/grok-account-monitor-frontend:latest}
    init: true
    restart: unless-stopped
    depends_on:
      monitor-backend:
        condition: service_healthy
    ports:
      - "${MONITOR_WEB_BIND:-0.0.0.0}:${MONITOR_WEB_PORT:-8091}:80"

volumes:
  monitor-data:
